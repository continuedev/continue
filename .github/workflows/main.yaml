name: Publish Extension

on:
  release:
    types: [released]

  workflow_dispatch:
    inputs:
      publish_build:
        description: "Whether or not to publish the built extension to the VS Code marketplace"
        required: true
        default: "false"
      darwin_runner:
        description: "Runner for the two macOS packages. ubuntu-latest builds them on Linux (prepackage is target-aware), as the tested builds were."
        required: false
        default: ubuntu-latest
      release_tag:
        description: "Create this release and tag (v<version>-vscode, matching extensions/vscode/package.json) at the commit being built. Empty: build only, unless run from a tag."
        required: false
        default: ""

jobs:
  check_release_name:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        working-directory: .
        run: |
          if [[ "${{ github.event.release.tag_name }}" == v*-vscode ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # This ensures all tags are fetched (checks out the run's ref)

      - name: Make sure version isn't odd
        run: |
          cd extensions/vscode
          node scripts/versionCheck.js

  build:
    needs: [check_release_name, check-version]
    if: needs.check_release_name.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
            npm_config_arch: x64
          - os: windows-latest
            platform: win32
            arch: arm64
            npm_config_arch: arm
          - os: ubuntu-latest
            platform: linux
            arch: x64
            npm_config_arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            npm_config_arch: arm64
          # No armhf or alpine package: the native modules (SQLite, ONNX
          # runtime, LanceDB, ripgrep) fell back to the arm64 and x64 glibc
          # builds, so those packages did not work on 32-bit ARM or musl.
          - os: ${{ inputs.darwin_runner || 'ubuntu-latest' }}
            platform: darwin
            arch: x64
            npm_config_arch: x64
          - os: ${{ inputs.darwin_runner || 'ubuntu-latest' }}
            platform: darwin
            arch: arm64
            npm_config_arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - uses: ./.github/actions/build-vscode-extension
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          npm_config_arch: ${{ matrix.npm_config_arch }}
          pre-release: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}-vsix
          path: "extensions/vscode/*.vsix"

      # The "agents" build adds the proposed APIs for VS Code's Agents window
      # (scripts/agents-manifest.js). The Marketplace refuses proposed APIs,
      # so it is a separate artifact, attached to the GitHub release only.
      - name: Package the agents build
        shell: bash
        run: |
          cd extensions/vscode
          node scripts/agents-manifest.js
          version=$(node -p "require('./package.json').version")
          mkdir -p agents
          npx vsce package --no-dependencies --target ${{ matrix.platform }}-${{ matrix.arch }} \
            --out "agents/continued-${{ matrix.platform }}-${{ matrix.arch }}-${version}-agents.vsix"
          git checkout -- package.json

      - name: Upload agents .vsix artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}-vsix-agents
          path: "extensions/vscode/agents/*.vsix"

  release:
    # Only a tag becomes a release. Run from a branch, the workflow builds
    # every package and stops here (a dry run), instead of tagging a release
    # with the branch name.
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      # Download the .vsix artifacts
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-vsix"
          path: vsix-artifacts
          merge-multiple: true

      # The agents builds go on the GitHub release too (not to the Marketplace).
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-vsix-agents"
          path: vsix-artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: vsix-artifacts
        run: |
          sha256sum *.vsix > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes
        id: notes
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          version=$(node -p "require('./extensions/vscode/package.json').version")
          if [ "$TAG" != "v$version-vscode" ]; then
            echo "::error::Tag $TAG does not match the extension version $version (expected v$version-vscode)."
            exit 1
          fi
          notes=".github/release-notes/$TAG.md"
          if [ ! -f "$notes" ]; then
            echo "::error::Missing $notes; write the release notes before releasing."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "path=$notes" >> "$GITHUB_OUTPUT"
          echo "name=Continued $version" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          # A new tag is created at the commit that was built.
          target_commitish: ${{ github.sha }}
          name: ${{ steps.notes.outputs.name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            vsix-artifacts/*.vsix
            vsix-artifacts/SHA256SUMS.txt
          token: ${{ secrets.GITHUB_TOKEN }}

  # VS Code Marketplace, by trusted publishing (OIDC): no token is stored. The
  # Marketplace exchanges this job's GitHub ID token for a short-lived
  # credential, under a policy for this repository, this workflow file and
  # the `marketplace` environment. Only the normal builds are published: the
  # agents builds use proposed APIs, which the Marketplace refuses.
  publish-marketplace:
    runs-on: ubuntu-latest
    needs:
      - build
    if: (github.event_name != 'workflow_dispatch' || github.event.inputs.publish_build == 'true') && github.repository == 'b1tninja/continued'
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-vsix"
          path: vsix-artifacts
          merge-multiple: true

      - name: Publish to VS Code Marketplace
        run: |
          # Each package gets its own ID token and Marketplace credential.
          for f in vsix-artifacts/*.vsix; do npx --yes @vscode/vsce@4.1.0 publish --oidc --packagePath "$f"; done

  # Open VSX has no trusted publishing, so it keeps its token; skipped when the
  # secret is not set.
  publish-openvsx:
    runs-on: ubuntu-latest
    needs:
      - build
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.publish_build == 'true'
    permissions:
      contents: read
    env:
      OVSX_PAT: ${{ secrets.VSX_REGISTRY_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8
        if: env.OVSX_PAT != ''
        with:
          pattern: "*-vsix"
          path: vsix-artifacts
          merge-multiple: true

      - name: Publish to Open VSX Registry
        if: env.OVSX_PAT != ''
        continue-on-error: true
        run: |
          for f in vsix-artifacts/*.vsix; do npx --yes ovsx@1.3.0 publish --packagePath "$f"; done
