name: LLM price drift

# Checks the hard-coded per-token prices in core/llm/utils/calculateRequestCost.ts
# against the official Anthropic and OpenAI pricing pages, so the cost shown in
# the console and CLI does not silently go stale.
on:
  pull_request:
    branches: [main]
    paths:
      - "core/llm/utils/calculateRequestCost.ts"
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Mattbusel/llm-prices@v1
        with:
          paths: core/llm/utils/calculateRequestCost.ts
          providers: anthropic,openai
          fail-on: drift
