name: Publish Pre-release Extension

on:
  release:
    types: [prereleased]

  workflow_dispatch:
    inputs:
      publish_build:
        description: "Whether or not to publish the built extension to the VS Code marketplace"
        required: true
        default: "false"

jobs:
  check_release_name:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        working-directory: .
        run: |
          if [[ "${{ github.event.release.tag_name }}" == v*-vscode ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check_release_name
    if: needs.check_release_name.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
            npm_config_arch: x64
          - os: windows-latest
            platform: win32
            arch: arm64
            npm_config_arch: arm
          - os: ubuntu-latest
            platform: linux
            arch: x64
            npm_config_arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            npm_config_arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: armhf
            npm_config_arch: arm
          - os: ubuntu-latest
            platform: alpine
            arch: x64
            npm_config_arch: x64
          - os: macos-latest
            platform: darwin
            arch: x64
            npm_config_arch: x64
          - os: macos-latest
            platform: darwin
            arch: arm64
            npm_config_arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - uses: ./.github/actions/build-vscode-extension
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          npm_config_arch: ${{ matrix.npm_config_arch }}
          pre-release: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}-vsix
          path: "extensions/vscode/*.vsix"

  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      # Download the .vsix artifacts
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-vsix"
          path: vsix-artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            vsix-artifacts/*.vsix
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: true

  # VS Code Marketplace, by trusted publishing (OIDC): no token is stored. The
  # Marketplace exchanges this job's GitHub ID token for a short-lived
  # credential, under a policy for this repository, this workflow file and
  # the `marketplace` environment. Only the normal builds are published: the
  # agents builds use proposed APIs, which the Marketplace refuses.
  publish-marketplace:
    runs-on: ubuntu-latest
    needs:
      - build
    if: (github.event_name != 'workflow_dispatch' || github.event.inputs.publish_build == 'true') && github.repository == 'b1tninja/continuous'
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-vsix"
          path: vsix-artifacts
          merge-multiple: true

      - name: Publish to VS Code Marketplace (pre-release)
        run: |
          # Each package gets its own ID token and Marketplace credential.
          for f in vsix-artifacts/*.vsix; do npx --yes @vscode/vsce@4.1.0 publish --oidc --pre-release --packagePath "$f"; done

  # Open VSX has no trusted publishing, so it keeps its token; skipped when the
  # secret is not set.
  publish-openvsx:
    runs-on: ubuntu-latest
    needs:
      - build
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.publish_build == 'true'
    permissions:
      contents: read
    env:
      OVSX_PAT: ${{ secrets.VSX_REGISTRY_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8
        if: env.OVSX_PAT != ''
        with:
          pattern: "*-vsix"
          path: vsix-artifacts
          merge-multiple: true

      - name: Publish to Open VSX Registry (pre-release)
        if: env.OVSX_PAT != ''
        continue-on-error: true
        run: |
          for f in vsix-artifacts/*.vsix; do npx --yes ovsx@1.3.0 publish --pre-release --packagePath "$f"; done

  # After a successful pre-release, a PR that bumps the version for the next.
  bump-version:
    runs-on: ubuntu-latest
    needs:
      - publish-marketplace
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Pull latest changes from release
        run: git fetch origin ${{ github.ref }} && git checkout ${{ github.ref }}

      # 4. Create PR with version bump
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Create PR branch
        run: |
          BRANCH_NAME="chore/bump-vscode-version-$(date +%Y%m%d-%H%M%S)"
          git checkout -b $BRANCH_NAME
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Bump version in package.json
        run: |
          cd extensions/vscode
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "NEW_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          # Falls back to GITHUB_TOKEN (requires "Allow GitHub Actions to create
          # pull requests" in repo settings) when no PAT is configured.
          token: ${{ secrets.CI_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump vscode extension version to ${{ env.NEW_VERSION }}"
          title: "chore: bump vscode extension version to ${{ env.NEW_VERSION }}"
          body: |
            Automated PR to bump the VS Code extension version after successful pre-release publication.

            - Bumped version in extensions/vscode/package.json to ${{ env.NEW_VERSION }}
          branch: ${{ env.BRANCH_NAME }}
          base: main
          delete-branch: true

      # 5. Update version in package.json
