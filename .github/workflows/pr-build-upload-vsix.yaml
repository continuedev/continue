name: PR Build And Upload VSIX

# Builds and uploads VSIX artifacts for the `oneper` script across Linux, Windows, and macOS (ARM and Intel)
# On request only: it builds four targets (three of them on the slow Windows and macOS
# runners). Add the `build-vsix` label to a PR (it then rebuilds on every push) or run this
# workflow manually on any branch. The Linux package build in PR Checks runs on every PR.
on:
  pull_request:
    branches:
      - main
    types: [labeled, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      darwin_runner:
        description: "Runner for the darwin build. ubuntu-latest builds the macOS package on Linux (prepackage is target-aware) when no macOS runner is available."
        required: false
        default: macos-latest

# A newer push to the same branch/PR supersedes the run in flight; without this
# the fork's runner pool fills with stale runs and nothing starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload-vsix:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft != true &&
      contains(github.event.pull_request.labels.*.name, 'build-vsix'))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-latest
          - platform: win32
            arch: x64
            runner: windows-latest
          - platform: darwin
            arch: arm64
            runner: ${{ inputs.darwin_runner || 'macos-latest' }}
          # Intel Macs: main.yaml and preview.yaml publish this target, so it
          # is built here too.
          - platform: darwin
            arch: x64
            runner: ${{ inputs.darwin_runner || 'macos-latest' }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build VS Code extension
        uses: ./.github/actions/build-vscode-extension
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          npm_config_arch: ${{ matrix.arch }}
          pre-release: false
          commit-sha: ${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: vscode-extension-build-${{ matrix.platform }}-${{ matrix.arch }}
          path: extensions/vscode/build

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}-vsix
          path: "extensions/vscode/*.vsix"
