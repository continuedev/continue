version: 2

# Every npm workspace in this monorepo has its own package-lock.json and is
# installed independently, so each one must be listed explicitly.
# `directories` lets a single entry (and a single set of groups) cover them all.
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/core"
      - "/gui"
      - "/binary"
      - "/docs"
      - "/docs-site"
      - "/extensions/vscode"
      - "/extensions/cli"
      - "/packages/config-types"
      - "/packages/config-yaml"
      - "/packages/continue-sdk"
      - "/packages/continue-sdk/typescript"
      - "/packages/fetch"
      - "/packages/llm-info"
      - "/packages/openai-adapters"
      - "/packages/terminal-security"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    ignore:
      # @types/vscode must not be newer than engines.vscode in the extension's
      # package.json (vsce refuses to package otherwise); bump them together by hand.
      - dependency-name: "@types/vscode"
      # web-tree-sitter 0.x minor releases change the API (SyntaxNode/Parser moved,
      # QueryMatch.pattern renamed...). Dependabot files them as "minor" and the
      # grouped PR then fails tsc across core. Migrate by hand, then remove this.
      - dependency-name: web-tree-sitter
        update-types:
          ["version-update:semver-minor", "version-update:semver-major"]
      # @types/node must match the Node major the code actually runs on (the VS Code
      # extension host and the binary use Node 20/22, see .nvmrc and CI), otherwise code
      # compiles against APIs that do not exist at runtime. Bump it by hand together with
      # the Node runtime; minor/patch updates still flow.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @types/uuid 11 is a stub for uuid >= 11; core uses uuid 9, which needs @types/uuid 9.
      # Bump uuid itself (types are then bundled) and drop @types/uuid together.
      - dependency-name: "@types/uuid"
        update-types: ["version-update:semver-major"]
      # @huggingface/transformers 4 pins onnxruntime-node >= 1.24, which no longer ships macOS x64
      # binaries (core/node_modules/onnxruntime-node/bin/napi-v6/darwin/ has arm64 only), and we
      # still publish a darwin-x64 VSIX. Stay on 3.x until that target is dropped.
      - dependency-name: "@huggingface/transformers"
        update-types: ["version-update:semver-major"]
      # The OpenTelemetry 0.x packages (sdk-node, exporters, instrumentation) version together and
      # their peer range on @opentelemetry/api moves with every 0.x minor: sdk-node 0.300 needs
      # api >=1.10 while @opentelemetry/resources 2.12 needs api <1.10, so `npm ci` in
      # extensions/cli fails with ERESOLVE. Bump them by hand, as a set; patches still flow.
      - dependency-name: "@opentelemetry/sdk-node"
        update-types:
          ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@opentelemetry/exporter-metrics-otlp-grpc"
        update-types:
          ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@opentelemetry/exporter-metrics-otlp-http"
        update-types:
          ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@opentelemetry/instrumentation-http"
        update-types:
          ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@opentelemetry/instrumentation-fs"
        update-types:
          ["version-update:semver-minor", "version-update:semver-major"]
      # The binary and the extension package a prebuilt native sqlite3 pinned to v5.1.7
      # (extensions/vscode/scripts/download-copy-sqlite.js); the JS package must not
      # move ahead of it. Revisit together with a move to node:sqlite.
      - dependency-name: sqlite3
        update-types: ["version-update:semver-major"]
      # Tailwind 4 drops tailwind.config.js and the tailwindcss PostCSS plugin
      # (config moves to CSS, plugin to @tailwindcss/postcss); the GUI and docs-site
      # need a hand migration. A bare version bump fails the GUI build.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      # vitest 5 needs vite 8, whose esbuild peer (^0.27) conflicts with the CLI's
      # esbuild 0.25, and @vitest/ui must match vitest exactly. Bump vitest,
      # @vitest/* and esbuild together by hand.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      # svg-builder 3.0.4's ESM build uses a directory import
      # (dist/esm/elements/element.js -> "../content"), which Node rejects, so
      # the extension's JumpManager/InlineTipManager tests cannot load it.
      - dependency-name: svg-builder
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
    groups:
      # Minor/patch bumps are batched into one PR per directory; majors stay
      # individual so they can be reviewed (and reverted) on their own.
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: dtolnay/rust-toolchain

  - package-ecosystem: cargo
    directory: "/sync"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: "/extensions/intellij"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: "/manual-testing-sandbox"
    schedule:
      interval: monthly
    labels:
      - dependencies

  - package-ecosystem: pip
    directory: "/manual-testing-sandbox"
    schedule:
      interval: monthly
    labels:
      - dependencies
